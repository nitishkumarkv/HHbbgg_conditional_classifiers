sample_to_class: # processes and classes
    GGJets: is_non_resonant_bkg
    DDQCDGJET: is_non_resonant_bkg
    TTGG: is_non_resonant_bkg
    ttHtoGG_M_125: is_ttH_bkg
    GluGluHToGG_M_125: is_single_H_bkg
    VBFHToGG_M_125: is_single_H_bkg
    VHtoGG_M_125: is_single_H_bkg
    WmHtoGG: is_single_H_bkg
    WpHtoGG: is_single_H_bkg
    ZHtoGG: is_single_H_bkg
    GluGlutoHHto2B2G_kl_2p45_kt_1p00_c2_0p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_5p00_kt_1p00_c2_0p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_0p00_kt_1p00_c2_0p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_0p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_0p10: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_0p35: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_3p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_m2p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_0p00_kt_1p00_c2_1p00: is_GluGluToHH_sig
    GluGlutoHHto2B2G_kl_m20p00_kt_1p00_c2_2p24: is_GluGluToHH_sig

mHH_binning:
    variable: nonResReg_vbfpair_M_X
    edges: [350]

classification_type: multiclass
binary_classifier:
    signal_classes:
    - is_GluGluToHH_sig
    background_classes:
    - is_non_resonant_bkg

classes: # all classes
- is_non_resonant_bkg
- is_ttH_bkg
- is_single_H_bkg
- is_GluGluToHH_sig

class_weight_scale:
    is_non_resonant_bkg: 1.0
    is_ttH_bkg: 1.0
    is_single_H_bkg: 1.0
    is_GluGluToHH_sig: 2.0

weight_scheme_process: # how to weight each processes within a class
    # xsec : weight them according to the cross-section of each process
    # equal_weight: weight each process eqally, if there are two processes, you first weight the sum of each processes to be equal and then weight the whole class to be 1
    is_non_resonant_bkg: xsec 
    is_ttH_bkg: xsec
    is_single_H_bkg: xsec
    is_GluGluToHH_sig: equal_weight 

# some info for training
do_random_search: False
num_random_search: 1
weight_scheme: weighted_abs # weighted_only_positive # weighted_CRUW_abs # weighted_CRUW_only_positive
random_seed: 42
cuda_device: "0"

