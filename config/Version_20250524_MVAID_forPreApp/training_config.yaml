sample_to_class: # processes and classes
    GGJets: is_non_resonant_bkg
    DDQCDGJET: is_non_resonant_bkg
    TTGG: is_non_resonant_bkg
    ttHtoGG_M_125: is_ttH_bkg
    BBHto2G_M_125: is_single_H_bkg
    GluGluHToGG_M_125: is_single_H_bkg
    VBFHToGG_M_125: is_single_H_bkg
    VHtoGG_M_125: is_single_H_bkg
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_0p00: is_GluGluToHH_sig

classes: # all classes
- is_non_resonant_bkg
- is_ttH_bkg
- is_single_H_bkg
- is_GluGluToHH_sig

weight_scheme_process: # how to weight each processes within a class
    # xsec : weight them according to the cross-section of each process
    # equal_weight: weight each process eqally, if there are two processes, you first weight the sum of each processes to be equal and then weight the whole class to be 1
    is_non_resonant_bkg: xsec 
    is_ttH_bkg: xsec
    is_single_H_bkg: xsec
    is_GluGluToHH_sig: xsec 

# some info for training
do_random_search: False
num_random_search: 1
weight_scheme: weighted_abs # weighted_only_positive # weighted_CRUW_abs # weighted_CRUW_only_positive
random_seed: 42
cuda_device: "0"
max_epoch: 300

# Decorrelation settings
use_DisCo: True
decorr_lambda: 10.0
disco_reduce_method: mean # mean, max, sum, quadrature
# disco_decorr_class_idx: [0,1,2,3] # index of the class to decorrel, e.g. 0 for signal-only
z_variables: # "Z dataset" variables to decorrelate against, e.g. mjj
- nonResReg_dijet_mass_DNNreg 
- mass
decorrelation_variables:
    var1:
        - mass
        # - nonResReg_dijet_mass_DNNreg
    var2:
        - nonResReg_dijet_mass_DNNreg
        # - is_non_resonant_bkg
        # - is_ttH_bkg
        # - is_single_H_bkg
        # - is_GluGluToHH_sig
upweight_params: # conservative SR upweighting parameters
    do_upweight: True
    max_upweight: 10.0
    min_upweight: 1.0 # values less than 1 will DECREASE the weight of events far from SR, so be careful
    sr_definition:
        score_midpoint: # score value at which upweight reaches 50% of max_upweight (ORDER SENSITIVE)
            th_nonRes: 0.45
            th_ttH: 0.65
            th_singleH: 0.45
            th_ggFHH: 0.85
        score_90_percent: # score value at which upweight reaches 90% of max_upweight (ORDER SENSITIVE)
            th_nonRes: 0.10
            th_ttH: 0.50
            th_singleH: 0.20
            th_ggFHH: 0.90



