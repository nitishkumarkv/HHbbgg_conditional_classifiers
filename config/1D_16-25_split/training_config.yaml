sample_to_class: # processes and classes
    GGJets: is_nonRes_bkg
    DDQCDGJET: is_nonRes_bkg
    TTGG: is_nonRes_bkg
    ttHtoGG_M_125: is_Res_bkg
    #BBHto2G_M_125: is_Res_bkg
    GluGluHToGG_M_125: is_Res_bkg
    VBFHToGG_M_125: is_Res_bkg
    VHtoGG_M_125: is_Res_bkg
    GluGlutoHHto2B2G_kl_1p00_kt_1p00_c2_0p00: is_ggHH_sig
    VBFHH_CV_1p000_C2V_1p000_C3_1p000: is_VBFHH_sig

classes: # all classes
- is_nonRes_bkg
- is_Res_bkg
- is_ggHH_sig
- is_VBFHH_sig

weight_scheme_process: # how to weight each processes within a class
    # xsec : weight them according to the cross-section of each process
    # equal_weight: weight each process eqally, if there are two processes, you first weight the sum of each processes to be equal and then weight the whole class to be 1
    is_nonRes_bkg: xsec
    is_Res_bkg: xsec
    is_ggHH_sig: xsec
    is_VBFHH_sig: xsec

class_weight_scale: # optional: scale factor applied after per-class normalization to 1
    # Default (no key or 1.0): each class contributes equally (sum=1.0 each)
    # Use this to weight signal classes proportional to their production cross-sections
    # so the combined signal budget matches the old 3-class setup
    # sigma_ggHH = 0.034e3 fb, sigma_VBFHH = 0.00173e3 fb
    # ggHH fraction: 0.034 / (0.034 + 0.00173) = 0.9516
    # VBFHH fraction: 0.00173 / (0.034 + 0.00173) = 0.0484
    is_nonRes_bkg: 1.0
    is_Res_bkg: 1.0
    is_ggHH_sig: 0.9516
    is_VBFHH_sig: 0.0484

# some info for training
do_random_search: False
num_random_search: 1
weight_scheme: weighted_abs # weighted_only_positive # weighted_CRUW_abs # weighted_CRUW_only_positive
random_seed: 42
cuda_device: "3"
var_prefix: "nonResReg_vbfpair" # prefix for variables (e.g., "nonResReg" or "nonResReg_vbfpair")
train_fraction: 1

train_sample_fraction: 0.5
split_seed: 12345
train_split_dir_name: Train_split
final_split_dir_name: Final_split
# true: split data into Train_split and Final_split
# false: put all data into Final_split only
split_data: false

